<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Custom Flappy Game Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Orbitron',sans-serif;background:#c1440e;position:fixed}
#game{display:block;width:100%;height:100%;touch-action:none;position:absolute;top:0;left:0;z-index:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;text-align:center;padding:16px;overflow-y:auto}
.hidden{display:none!important}
#menu{background:rgba(20,5,0,.85)}
.title-outer{background:linear-gradient(135deg,#ff00cc33,#00ffe733);border:3px solid #00ffe7;border-radius:22px;padding:7px;box-shadow:0 0 35px #00ffe7aa}
.title-inner{background:#12002b;border:2px solid #ff00cc;border-radius:14px;padding:14px 22px}
h1{font-family:'Bungee',cursive;font-size:clamp(24px,7vw,45px);letter-spacing:2px;
   background:linear-gradient(90deg,#ff00cc,#ffe600,#00ffe7,#ff00cc);background-size:300% 100%;
   -webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 3s linear infinite}
@keyframes hue{to{background-position:300% 0}}
.credit{margin-top:6px;font-family:'Bungee';font-size:clamp(8px,2vw,12px);color:#9ef7ff}
.input-group{display:flex;flex-direction:column;gap:6px;width:min(320px,90vw);align-items:center}
label{font-size:11px;color:#00ffe7;font-weight:700;letter-spacing:1px}
input[type="text"]{background:rgba(255,255,255,.08);border:2px solid #00ffe7;color:#fff;border-radius:10px;padding:10px 14px;font-family:'Orbitron';font-size:14px;text-align:center;width:100%;outline:none}
.btn-main{font-family:'Bungee';font-size:clamp(15px,4.5vw,22px);color:#00ff88;cursor:pointer;text-shadow:0 0 14px #00ff88;padding:12px 28px;background:rgba(0,0,0,0.5);border:2px solid #00ff88;border-radius:16px;z-index:30;transition:0.2s}
.btn-main:active{transform:scale(0.95)}
.btn-gen{color:#ffe600;border-color:#ffe600;text-shadow:0 0 14px #ffe600;background:rgba(50,20,0,0.6)}
#linkBox{background:rgba(0,0,0,0.9);border:2px solid #00ffe7;border-radius:14px;padding:14px;width:min(360px,90vw);display:flex;flex-direction:column;gap:10px}
#shareLink{width:100%;padding:8px;background:#111;color:#00ff88;border:1px solid #00ff88;border-radius:8px;font-size:11px;text-align:center;word-break:break-all}
.btn-small{font-family:'Bungee';font-size:11px;padding:8px 16px;background:#ff00cc;border:none;color:#fff;border-radius:8px;cursor:pointer}
#gameover{background:rgba(0,0,0,.85)}
.go-outer{background:linear-gradient(135deg,#ff9500,#ff0055,#8a2be2);padding:7px;border-radius:26px;width:min(400px,90vw)}
.go-inner{background:#160026;border:3px solid #00ffe7;border-radius:18px;padding:16px}
.go-scores{display:flex;justify-content:center;gap:20px;margin:10px 0;font-weight:900}
.go-scores span{display:block;font-size:10px;color:#00ffe7}
.go-scores b{font-size:24px;color:#fff}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#retryBtn{background:linear-gradient(90deg,#00ff88,#00c8ff);border:none;color:#061;font-family:'Bungee';padding:10px 20px;border-radius:12px;font-size:13px;cursor:pointer}
.small-btn{background:#3b0f6b;border:2px solid #00ffe7;color:#fff;font-family:'Bungee';padding:10px 14px;border-radius:12px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HOME / GENERATOR MENU -->
<div id="menu" class="screen">
  <div class="title-outer"><div class="title-inner">
    <h1>CUSTOM FLAPPY</h1>
    <div class="credit">Create & Play Your Own Flappy Game!</div>
  </div></div>

  <div class="input-group">
    <label>YOUR NAME</label>
    <input type="text" id="playerNameInput" value="PLAYER001" maxlength="14">
  </div>

  <div class="input-group">
    <label>BIRD PHOTO FILENAME (e.g., shihanhead.png)</label>
    <input type="text" id="headPhotoInput" value="shihanhead.png">
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:5px;">
    <button id="playBtn" class="btn-main" type="button">▶ PLAY NOW</button>
    <button id="genLinkBtn" class="btn-main btn-gen" type="button">🔗 GENERATE LINK</button>
  </div>

  <div id="linkBox" class="hidden">
    <label>COPY YOUR SHORT SHAREABLE LINK:</label>
    <input type="text" id="shareLink" readonly>
    <button class="btn-small" id="copyBtn" type="button">COPY LINK</button>
  </div>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameover" class="screen hidden">
  <div class="go-outer"><div class="go-inner">
    <h1>GAME OVER</h1>
    <div class="go-scores">
      <div><span>SCORE</span><b id="goScore">0</b></div>
      <div><span>HIGH SCORE</span><b id="goHigh">0</b></div>
    </div>
    <div class="btn-row">
      <button id="retryBtn" type="button">▶ PLAY AGAIN</button>
      <button id="homeBtn" class="small-btn" type="button">🏠 HOME</button>
    </div>
  </div></div>
</div>

<script>
/* --- SOUND SYSTEM (hit1, hit2, jump1, jump2) --- */
const S = (fn) => {
  try {
    const a = new Audio(fn);
    a.volume = 0.8;
    a.play().catch(() => {});
  } catch (e) {}
};

let scoreI = 0, hitI = 0, flapCount = 0;
const sScore = () => S(`score${(scoreI++%3)+1}.mp3`);
const sHit = () => S(`hit${(hitI++%2)+1}.mp3`);

function sJump() {
  flapCount++;
  const idx = (Math.floor((flapCount - 1) / 2) % 2) + 1;
  S(`jump${idx}.mp3`);
}

/* --- URL PARAMS PARSING --- */
const params = new URLSearchParams(window.location.search);
const customName = params.get('name');
const customHead = params.get('head');

if (customName) document.getElementById('playerNameInput').value = customName;
if (customHead) document.getElementById('headPhotoInput').value = customHead;

/* --- CANVAS & GAME INIT --- */
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
let W, H, DL, skyGrad;

function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
  DL = Math.max(48, H * 0.085);
  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#ffb347');
  skyGrad.addColorStop(.45, '#ff8008');
  skyGrad.addColorStop(1, '#c1440e');
}
resize();
window.addEventListener('resize', resize);

/* --- BIRD HEAD IMAGE SETUP --- */
const headCanvas = document.createElement('canvas');
const headCtx = headCanvas.getContext('2d');
let headReady = false;

function loadBirdImage(src) {
  if (!src) return;
  const rawImg = new Image();
  rawImg.crossOrigin = "anonymous";
  rawImg.onload = () => {
    const sz = 160;
    headCanvas.width = sz; headCanvas.height = sz;
    const cx = sz / 2, cy = sz / 2, rad = sz / 2 - 5;

    headCtx.save();
    headCtx.beginPath();
    headCtx.arc(cx, cy, rad, 0, Math.PI * 2);
    headCtx.closePath();
    headCtx.clip();

    const iw = rawImg.naturalWidth || rawImg.width;
    const ih = rawImg.naturalHeight || rawImg.height;
    const minDim = Math.min(iw, ih);
    headCtx.drawImage(rawImg, (iw - minDim) / 2, (ih - minDim) / 2, minDim, minDim, cx - rad, cy - rad, rad * 2, rad * 2);
    headCtx.restore();

    headCtx.strokeStyle = '#ffd700';
    headCtx.lineWidth = 6;
    headCtx.beginPath();
    headCtx.arc(cx, cy, rad, 0, Math.PI * 2);
    headCtx.stroke();
    headReady = true;
  };
  rawImg.src = src;
}

loadBirdImage(customHead || document.getElementById('headPhotoInput').value || 'shihanhead.png');

/* --- DESERT ASSETS & GRAPHICS --- */
let clouds = [], camels = [], dunesX = 0;

function initDesertAssets() {
  clouds = Array.from({ length: 6 }, () => ({
    x: Math.random() * W,
    y: H * 0.1 + Math.random() * H * 0.3,
    s: 20 + Math.random() * 30,
    v: 0.2 + Math.random() * 0.4
  }));
  camels = Array.from({ length: 2 }, () => ({
    x: Math.random() * W,
    s: DL * 1.4
  }));
}

function drawCamel(c) {
  ctx.save();
  ctx.translate(c.x, H - DL);
  ctx.scale(c.s / (DL * 1.4), c.s / (DL * 1.4));
  ctx.fillStyle = 'rgba(60,20,0,.45)';
  ctx.beginPath();
  ctx.ellipse(0, -DL * 0.55, DL * 0.5, DL * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-DL * 0.15, -DL * 0.72, DL * 0.2, DL * 0.18, 0, 0, Math.PI * 2);
  ctx.ellipse(DL * 0.18, -DL * 0.72, DL * 0.2, DL * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(DL * 0.35, -DL * 0.6);
  ctx.quadraticCurveTo(DL * 0.6, -DL * 0.95, DL * 0.72, -DL * 0.95);
  ctx.lineTo(DL * 0.78, -DL * 0.85);
  ctx.quadraticCurveTo(DL * 0.55, -DL * 0.75, DL * 0.4, -DL * 0.45);
  ctx.fill();
  ctx.fillRect(-DL * 0.42, -DL * 0.35, DL * 0.09, DL * 0.35);
  ctx.fillRect(-DL * 0.2, -DL * 0.35, DL * 0.09, DL * 0.35);
  ctx.fillRect(DL * 0.15, -DL * 0.35, DL * 0.09, DL * 0.35);
  ctx.fillRect(DL * 0.32, -DL * 0.35, DL * 0.09, DL * 0.35);
  ctx.restore();
}

/* --- GAME STATE --- */
let mode = 'menu', bird, pipes, score, frame, groundX, shake = 0;

function initGame() {
  bird = { x: W * 0.28, y: H / 2, v: 0, r: Math.max(16, DL * 0.35), wing: 0, rot: 0 };
  pipes = []; score = 0; frame = 0; groundX = 0; shake = 0;
  initDesertAssets();
}

function flap() {
  bird.v = -7.5 * (DL / 60);
  bird.wing = 8;
  sJump();
}

function spawnPipe() {
  const gap = DL * 2.6, pw = DL * 0.9;
  const top = DL * 0.8 + Math.random() * (H - DL * 0.8 - gap - DL * 1.6);
  pipes.push({ x: W + pw, top, gap, pw, passed: false });
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  const r = bird.r;

  ctx.fillStyle = '#f7b500';
  ctx.beginPath();
  ctx.ellipse(-r * 0.2, r * 0.15, r * 0.85, r * 0.72, 0, 0, Math.PI * 2);
  ctx.fill();

  if (headReady) {
    const hr = r * 0.95;
    ctx.drawImage(headCanvas, r * 0.35 - hr, -r * 0.18 - hr, hr * 2, hr * 2);
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * .45, -r * .35, r * .3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(r * .55, -r * .35, r * .14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff2200'; ctx.beginPath();
    ctx.moveTo(r * .8, r * .05); ctx.lineTo(r * 1.5, r * .25); ctx.lineTo(r * .8, r * .45); ctx.fill();
  }

  ctx.restore();
}

function drawScene() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Background Sun & Clouds
  ctx.fillStyle = 'rgba(255,255,200,.9)'; ctx.beginPath(); ctx.arc(W * 0.75, H * 0.18, DL * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,180,.25)'; ctx.beginPath(); ctx.arc(W * 0.75, H * 0.18, DL * 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.15)';
  clouds.forEach(c => {
    c.x -= c.v;
    if (c.x < -c.s * 3) c.x = W + c.s;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.s, 0, Math.PI * 2);
    ctx.arc(c.x + c.s, c.y + 6, c.s * .7, 0, Math.PI * 2);
    ctx.arc(c.x - c.s, c.y + 6, c.s * .7, 0, Math.PI * 2);
    ctx.fill();
  });

  const sp0 = 3.2 * (DL / 60);
  camels.forEach(c => {
    c.x -= sp0 * 0.3;
    if (c.x < -c.s * 2) { c.x = W + Math.random() * W * 0.5; c.s = DL * (1 + Math.random() * 0.6); }
    drawCamel(c);
  });

  // Pipes
  pipes.forEach(p => {
    ctx.fillStyle = '#b57832';
    ctx.fillRect(p.x, 0, p.pw, p.top);
    ctx.fillRect(p.x, p.top + p.gap, p.pw, H - p.top - p.gap);
    ctx.fillStyle = '#c98a3d';
    ctx.fillRect(p.x + p.pw * 0.2, 0, p.pw * 0.35, p.top);
    ctx.fillRect(p.x + p.pw * 0.2, p.top + p.gap, p.pw * 0.35, H - p.top - p.gap);
    ctx.fillStyle = '#4a2c10';
    ctx.fillRect(p.x - 4, p.top - 14, p.pw + 8, 14);
    ctx.fillRect(p.x - 4, p.top + p.gap, p.pw + 8, 14);
  });

  // Dunes Ground
  dunesX = (groundX + 4 * (DL / 60)) % DL;
  ctx.fillStyle = '#e0a860'; ctx.fillRect(0, H - DL, W, DL);
  ctx.fillStyle = '#c98a3d'; for (let x = -dunesX; x < W; x += DL) ctx.fillRect(x, H - DL, DL * .5, 6);

  drawBird();

  ctx.font = `900 ${DL}px Orbitron,sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(score, W / 2, DL * 1.3);
}

function die() {
  if (mode === 'over') return;
  sHit();
  shake = 14;
  mode = 'over';
  setTimeout(() => {
    document.getElementById('goScore').textContent = score;
    document.getElementById('goHigh').textContent = score;
    document.getElementById('gameover').classList.remove('hidden');
  }, 450);
}

function update() {
  frame++;
  if (mode === 'menu') {
    bird.y = H / 2 + Math.sin(frame * 0.05) * DL * 0.4;
    bird.rot = 0;
    groundX = (groundX + 4 * (DL / 60)) % DL;
    return;
  }
  if (mode !== 'play') return;

  bird.v += 0.35 * (DL / 60);
  bird.y += bird.v;
  bird.rot = Math.min(1.2, bird.v / 12);
  if (bird.wing > 0) bird.wing--;

  if (bird.y + bird.r > H - DL || bird.y - bird.r < 0) {
    die();
    return;
  }

  const spawnRate = Math.max(40, Math.round(126 * (60 / DL)));
  if (frame % spawnRate === 0) spawnPipe();

  const sp = 3.2 * (DL / 60);
  pipes.forEach(p => {
    p.x -= sp;
    if (!p.passed && p.x + p.pw < bird.x) {
      p.passed = true;
      score++;
      sScore();
    }
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.pw && (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap)) {
      die();
    }
  });
  pipes = pipes.filter(p => p.x + p.pw > -10);
}

function loop() {
  update();
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    shake -= 1;
  }
  drawScene();
  ctx.restore();
  requestAnimationFrame(loop);
}

initGame();
loop();

/* --- UI EVENT LISTENERS --- */
window.addEventListener('pointerdown', (e) => {
  if (mode === 'play') {
    e.preventDefault();
    flap();
  }
});

document.getElementById('playBtn').addEventListener('click', () => {
  document.getElementById('menu').classList.add('hidden');
  initGame();
  mode = 'play';
});

document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('gameover').classList.add('hidden');
  initGame();
  mode = 'play';
});

document.getElementById('homeBtn').addEventListener('click', () => {
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  mode = 'menu';
});

/* --- GENERATE SHORT SHAREABLE LINK --- */
document.getElementById('genLinkBtn').addEventListener('click', () => {
  const nameVal = document.getElementById('playerNameInput').value;
  const headVal = document.getElementById('headPhotoInput').value;

  const baseUrl = window.location.origin + window.location.pathname;
  const query = new URLSearchParams();
  query.set('name', nameVal);
  if (headVal) query.set('head', headVal);

  const finalLink = `${baseUrl}?${query.toString()}`;
  document.getElementById('shareLink').value = finalLink;
  document.getElementById('linkBox').classList.remove('hidden');
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const linkInput = document.getElementById('shareLink');
  linkInput.select();
  navigator.clipboard.writeText(linkInput.value);
  alert('Link Copied to Clipboard!');
});
</script>
</body>
</html>
